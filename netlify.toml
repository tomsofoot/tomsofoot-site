[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/youtube-latest"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# =====================================================================
# Système d'ARTICLES HTML + DOSSIERS (ADDITIF — n'affecte aucune route existante)
# Rendu serveur : texte en vrai HTML, SEO, RLS public. Brouillons invisibles.
# =====================================================================
[[redirects]]
  from = "/sitemap-articles.xml"
  to = "/.netlify/functions/sitemap-articles"
  status = 200

[[redirects]]
  from = "/articles"
  to = "/.netlify/functions/articles-index"
  status = 200

[[redirects]]
  from = "/articles/"
  to = "/.netlify/functions/articles-index"
  status = 200

# Dossiers AVANT articles/:slug (chemins distincts, ordre sans ambiguïté)
[[redirects]]
  from = "/dossiers/:slug"
  to = "/.netlify/functions/dossier?slug=:slug"
  status = 200

[[redirects]]
  from = "/articles/:slug"
  to = "/.netlify/functions/article?slug=:slug"
  status = 200

# =====================================================================
# APERÇU MODE CARRIÈRE — build depuis la source (dossier mc-src/), DEPLOY PREVIEW UNIQUEMENT.
# La production (main) reste servie statiquement : aucune commande hors preview.
# =====================================================================
[context.deploy-preview]
  command = "python3 -m pip install --quiet Pillow && cp mc-src/* /tmp/ && mkdir -p mode-carriere/assets && JOGADLE_ASSETS_OUT=\"$PWD/mode-carriere/assets\" JOGADLE_MODE=prod python3 mc-src/build_full.py && cp /tmp/Jogadle2-Mode-Carriere-PROD.html mode-carriere/index.html && cp /tmp/game.js mode-carriere/game.js"
  publish = "."

[context.deploy-preview.environment]
  PYTHON_VERSION = "3.11"
