<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aperçu carte de partage — Jogadle</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0a1120;color:#eaf1fb;font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 16px}
  h1{font-size:20px;margin:0;font-weight:800}
  p{margin:0;color:#9fb2cc;font-size:14px;text-align:center;max-width:60ch}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-weight:700;border:1px solid rgba(120,160,230,.5);background:rgba(30,95,220,.18);color:#eaf1fb;padding:10px 16px;border-radius:10px;cursor:pointer}
  button.primary{background:#0a4eb8;border-color:#0a4eb8;color:#fff}
  button:hover{filter:brightness(1.08)}
  #wrap img{width:min(540px,92vw);height:auto;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
</style>
</head>
<body>
  <h1>Aperçu de la carte de partage</h1>
  <p>Page de test : la carte est générée exactement comme après une vraie partie, avec des données d'exemple. Choisis un score pour voir la médaille correspondante, puis télécharge le PNG.</p>
  <div class="row">
    <button data-score="1" data-points="1000">Score 1 (Imparable)</button>
    <button data-score="4" data-points="820" class="primary">Score 4 (Expert)</button>
    <button data-score="8" data-points="540">Score 8 (Bien joué)</button>
    <button data-score="16" data-points="210">Score 16 (Tenace)</button>
  </div>
  <div id="wrap"></div>
  <div class="row"><button id="dl" class="primary">⬇ Télécharger le PNG</button></div>

  <script src="js/share-card.js"></script>
  <script>
    function rowsFor(score){
      var rows=[];
      for(var i=0;i<score;i++){
        var last = (i===score-1);
        rows.push(Array.from({length:7},function(_,c){
          if(last) return "correct";
          return (Math.sin((i+1)*(c+2))>0) ? "correct" : "wrong";
        }));
      }
      return rows;
    }
    var current = null;
    async function show(score, points){
      var canvas = await window.JogadleShareCard.render({ puzzleId:"127", score:score, points:points, rows:rowsFor(score) });
      current = canvas;
      var img = new Image(); img.src = canvas.toDataURL("image/png");
      var w = document.getElementById("wrap"); w.innerHTML=""; w.appendChild(img);
    }
    document.querySelectorAll("button[data-score]").forEach(function(b){
      b.addEventListener("click", function(){ show(parseInt(b.dataset.score,10), parseInt(b.dataset.points,10)); });
    });
    document.getElementById("dl").addEventListener("click", function(){
      if(!current) return;
      var a=document.createElement("a"); a.download="jogadle-apercu.png"; a.href=current.toDataURL("image/png",1); a.click();
    });
    show(4, 820);
  </script>
</body>
</html>
