<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Défie ton pote — aperçu d’intégration</title>
<link rel="stylesheet" href="../css/defi-pote.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#030b13;color:#f7fbff;font:15px/1.5 DefiSans,Arial,sans-serif;padding:24px 16px}
  main{max-width:720px;margin:0 auto}
  h1{font:italic 900 30px/1.1 DefiSans,Arial,sans-serif;margin:0 0 6px}
  p{color:#a9bdc9;margin:0 0 14px}
  fieldset{border:1px solid #1d3d52;border-radius:14px;padding:14px;margin:0 0 14px}
  legend{padding:0 6px;color:#6df3a3;font-weight:700}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#c8d6de;min-width:0}
  input,select{min-height:44px;border-radius:10px;border:1px solid #35576b;background:#0c2433;color:#fff;padding:0 10px;font:inherit;width:100%}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  button.go{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid #fff0a2;background:#ffe00b;color:#10222c;font:700 15px DefiSans,Arial,sans-serif;cursor:pointer}
  button.alt{background:#0c2433;color:#fff;border-color:#35576b}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #56f994;outline-offset:2px}
  output{display:block;margin-top:10px;font-size:13px;color:#ffd06b;min-height:1.4em}
  code{color:#d6fff1}
</style>
</head>
<body>
<main>
  <h1>Défie ton pote</h1>
  <p>Aperçu d’intégration du composant validé. Cette page n’envoie <strong>aucun</strong> défi et ne modifie aucun score : elle affiche le montant que le serveur aurait validé.</p>
  <form id="f">
    <fieldset><legend>Joueurs</legend>
      <div class="row">
        <label>Joueur 1 <input name="n1" value="Tomso" maxlength="40"></label>
        <label>Points <input name="p1" type="number" value="35" min="0"></label>
        <label>Joueur 2 <input name="n2" value="Alex" maxlength="40"></label>
        <label>Points <input name="p2" type="number" value="12" min="0"></label>
      </div>
    </fieldset>
    <fieldset><legend>Défi validé par le serveur</legend>
      <div class="row">
        <label>Identifiant du défi <input name="id" value="defi-2026-11-06-0042"></label>
        <label>Mise validée <select name="amount"><option>1</option><option>2</option><option>3</option><option>5</option><option selected>7</option><option>10</option></select></label>
        <label>Montants autorisés (vide = selon les soldes) <input name="allowed" placeholder="ex. 1,2,3,5,7,10"></label>
      </div>
    </fieldset>
    <div class="btns">
      <button class="go" type="submit">Lancer l’animation</button>
      <button class="go alt" type="button" id="demo">Rejouer la démo validée (10 pts)</button>
    </div>
    <output id="out" role="status"></output>
  </form>
</main>
<script src="../js/defi-pote/defi-plan.js"></script>
<script src="../js/defi-pote/defi-scene.js"></script>
<script src="../js/defi-pote/defi-player.js"></script>
<script>
(function () {
  "use strict";
  var f = document.getElementById("f"), out = document.getElementById("out");
  function list(s) { return s ? String(s).split(",").map(Number).filter(function (n) { return !isNaN(n); }) : undefined; }
  function plan(s) { return s ? { eliminations: String(s).split("|").map(function (g) { return g ? g.split(",").map(Number) : []; }) } : undefined; }
  function launch(o) {
    var p = window.TomsoDefiPote.open(o);
    out.textContent = p.plan.ok ? "Plan " + (p.plan.source === "enregistre" ? "enregistré" : "dérivé") + " : " + JSON.stringify(p.plan.eliminations.map(function (e) { return e.indices; })) : "Refusé : " + p.plan.message;
    window.__defi = p;
    return p;
  }
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var d = new FormData(f);
    launch({ challengeId: d.get("id"), amount: Number(d.get("amount")), allowedAmounts: list(d.get("allowed")),
      players: [{ name: d.get("n1"), points: Number(d.get("p1")) }, { name: d.get("n2"), points: Number(d.get("p2")) }] });
  });
  document.getElementById("demo").addEventListener("click", function () {
    launch({ challengeId: "demo-validee", amount: 10, plan: { eliminations: [[0, 2], [1, 3], [4]] },
      players: [{ name: "Tomso", points: 35 }, { name: "Alex", points: 35 }] });
  });
  // Paramètres d'URL (tests) : ?id=…&amount=7&n1=…&p1=…&n2=…&p2=…&allowed=1,2,3&plan=0,2|1,3|4&open=1
  var q = new URLSearchParams(location.search);
  if (q.get("open")) {
    launch({ challengeId: q.get("id") || "defi-test", amount: Number(q.get("amount") || 10), allowedAmounts: list(q.get("allowed")), plan: plan(q.get("plan")),
      players: [{ name: q.get("n1") || "Tomso", points: Number(q.get("p1") || 35) }, { name: q.get("n2") || "Alex", points: Number(q.get("p2") || 35) }] });
  }
})();
</script>
</body>
</html>
